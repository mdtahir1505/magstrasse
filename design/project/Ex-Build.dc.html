<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STRASSE — Build the sentence</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./strasse.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap">
<style>body{margin:0} .ruled{background:repeating-linear-gradient(transparent 0 58px, var(--c-line) 58px 60px)}</style>
</helmet>
<main class="screen" style="width: 390px; height: 844px">
  <div class="pad session-top">
    <a class="icon-btn" href="Main.dc.html" aria-label="End session"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <div class="segbar" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="{{total}}" aria-valuenow="{{pos}}">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="3"><div class="{{s.cls}}" style="--w: {{s.w}}"><i style="width: {{s.pct}}%"></i></div></sc-for>
    </div>
    <span class="count">{{pos}}/{{total}}</span>
  </div>
  <p class="block-label pad" style="margin-top: 4px">{{blockName}}</p>

  <h1 class="instruction pad" style="margin-top: 18px">Build it</h1>
  <div class="pad" style="margin-top: 14px">
    <div class="paper tilt" style="--rot: -1deg; padding: 14px 16px">
      <p class="eyebrow">Say this in {{langName}}</p>
      <p class="prompt" style="margin-top: 4px">{{exercise.prompt}}</p>
    </div>
  </div>

  <div class="pad" style="margin-top: 26px">
    <div class="ruled" lang="{{lang}}" aria-label="Your sentence" style="min-height: 120px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px 8px; padding-top: 6px">
      <sc-for list="{{placed}}" as="t" hint-placeholder-count="3">
        <button type="button" class="tile" onClick="{{t.remove}}" style="animation: pop 240ms var(--ease-snap)">{{t.text}}</button>
      </sc-for>
    </div>
  </div>

  <div class="pad" lang="{{lang}}" style="margin-top: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 8px">
    <sc-for list="{{bank}}" as="t" hint-placeholder-count="8">
      <button type="button" class="{{t.cls}}" onClick="{{t.add}}" disabled="{{t.used}}" aria-hidden="{{t.hidden}}">{{t.text}}</button>
    </sc-for>
  </div>

  <div class="foot" style="margin-top: 22px">
    <a class="{{checkCls}}" href="Ex-Type.dc.html">Check</a>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"exercise":{"editor":null,"tsType":"Extract<Exercise, { kind: \"build\" }>"},"session":{"editor":null,"tsType":"Session"},"lang":{"editor":null,"tsType":"string"},"langName":{"editor":null,"tsType":"string"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { placed: [2, 5, 1] }; // demo: "Ich hätte gern" already placed
  renderVals() {
    const ex = this.props.exercise ?? { kind: 'build', prompt: "I'd like a coffee, please.", tiles: ['Kaffee', 'gern', 'Ich', 'bitte', 'habe', 'hätte', 'einen', 'ein'], answer: ['Ich', 'hätte', 'gern', 'einen', 'Kaffee', 'bitte'] };
    const filler = (n) => Array.from({ length: n }, () => ({ kind: 'say', target: '', english: '' }));
    const S = this.props.session ?? { blocks: [{ name: 'review', exercises: filler(8) }, { name: 'new', exercises: filler(10) }, { name: 'speak', exercises: filler(6) }], current: { block: 1, exercise: 4 } };
    const segs = S.blocks.map((b, i) => {
      const n = b.exercises.length;
      const d = i < S.current.block ? n : i === S.current.block ? S.current.exercise : 0;
      return { w: n, pct: Math.round((d / n) * 100), cls: 'bar' + (d === n ? ' done' : '') };
    });
    const total = S.blocks.reduce((a, b) => a + b.exercises.length, 0);
    const pos = S.blocks.slice(0, S.current.block).reduce((a, b) => a + b.exercises.length, 0) + S.current.exercise + 1;
    const blockName = { review: 'Review', new: 'New lesson', speak: 'Listen & speak' }[S.blocks[S.current.block].name];
    const placedIdx = this.state.placed.filter((i) => i < ex.tiles.length);
    return {
      segs, total, pos, blockName, exercise: ex,
      lang: this.props.lang ?? 'de', langName: this.props.langName ?? 'German',
      placed: placedIdx.map((i) => ({ text: ex.tiles[i], remove: () => this.setState({ placed: this.state.placed.filter((x) => x !== i) }) })),
      bank: ex.tiles.map((text, i) => {
        const used = placedIdx.includes(i);
        return { text, used, hidden: used ? 'true' : 'false', cls: 'tile' + (used ? ' ghost' : ''), add: () => !used && this.setState({ placed: [...this.state.placed, i] }) };
      }),
      checkCls: 'btn block' + (placedIdx.length ? '' : ' off'),
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STRASSE — Daily goal</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./strasse.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap">
<style>body{margin:0}</style>
</helmet>
<main class="screen" style="width: 390px; height: 844px">
  <div class="pad session-top">
    <a class="icon-btn plain" href="Onboard-2-Why.dc.html" aria-label="Back"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="segbar" aria-label="Step 3 of 4">
      <div class="bar thin"><i style="width: 100%"></i></div>
      <div class="bar thin"><i style="width: 100%"></i></div>
      <div class="bar thin"><i style="width: 100%"></i></div>
      <div class="bar thin"><i style="width: 0%"></i></div>
    </div>
    <span class="count">3/4</span>
  </div>

  <section class="pad" style="margin-top: 30px">
    <p class="eyebrow">Daily goal</p>
    <h1 class="display" style="font-size: 52px; margin-top: 10px">How long<br>per <span style="color: var(--c-cyan)">day?</span></h1>
    <p class="dim" style="margin-top: 12px">Change it any time. Nobody's counting but you.</p>
  </section>

  <div class="pad" role="radiogroup" aria-label="Minutes per day" style="margin-top: 28px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{goals}}" as="g" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{g.checked}}" class="{{g.cls}}" onClick="{{g.pick}}" style="position: relative">
        <span class="display" style="font-size: 40px; width: 64px; line-height: 1">{{g.min}}</span>
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-weight: 800">{{g.name}} · {{g.min}} min</span>
          <span style="font-size: 14px; font-weight: 500; opacity: .8">{{g.desc}}</span>
        </span>
        <sc-if value="{{g.rec}}" hint-placeholder-val="{{ false }}"><span class="sticker p" style="--rot: 6deg; position: absolute; right: -6px; top: -12px">Recommended</span></sc-if>
      </button>
    </sc-for>
  </div>

  <div class="foot" style="margin-top: auto">
    <a class="btn block" href="Onboard-4-Reminder.dc.html">Next</a>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"options":{"editor":null,"tsType":"(5 | 15 | 30 | 45)[]"},"defaultGoal":{"editor":"enum","options":[5,15,30,45],"default":30},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { picked: null };
  renderVals() {
    const META = {
      5: ['Snack', 'One quick block. Better than zero.'],
      15: ['Casual', 'Review + a few new words.'],
      30: ['Serious', 'Full session: review, new, speak.'],
      45: ['Obsessed', 'Full session plus a bonus round.'],
    };
    const picked = this.state.picked ?? Number(this.props.defaultGoal ?? 30);
    const goals = (this.props.options ?? [5, 15, 30, 45]).map((min) => {
      const on = picked === min;
      return {
        min, name: META[min][0], desc: META[min][1], rec: min === 30,
        checked: on ? 'true' : 'false',
        cls: 'opt' + (on ? ' sel' : ''),
        pick: () => this.setState({ picked: min }),
      };
    });
    return { goals };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STRASSE — Pick a language</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./strasse.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap">
<style>body{margin:0}</style>
</helmet>
<main class="screen" style="width: 390px; height: 844px">
  <div class="pad session-top">
    <div class="segbar" aria-label="Step 1 of 4">
      <div class="bar thin"><i style="width: 100%"></i></div>
      <div class="bar thin"><i style="width: 0%"></i></div>
      <div class="bar thin"><i style="width: 0%"></i></div>
      <div class="bar thin"><i style="width: 0%"></i></div>
    </div>
    <span class="count">1/4</span>
  </div>

  <section class="pad" style="margin-top: 28px; position: relative">
    <div class="logo" style="margin-bottom: 26px"><span class="display" style="font-size: 44px">STRASSE</span><span class="marker" style="font-size: 20px; right: -28px; top: -18px">hallo!</span></div>
    <h1 class="display" style="font-size: 52px">What are we<br><span style="color: var(--c-yellow)">learning?</span></h1>
    <p class="dim" style="margin-top: 12px">Pick one. You can add more later.</p>
  </section>

  <ul class="pad" style="margin-top: 30px; display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{languages}}" as="l" hint-placeholder-count="2">
      <li>
        <button type="button" class="{{l.cls}}" onClick="{{l.pick}}" disabled="{{l.disabled}}" aria-pressed="{{l.pressed}}" style="position: relative; width: 100%; display: flex; align-items: center; gap: 16px; padding: 18px; text-align: left; cursor: pointer; font-family: var(--f-body)">
          <span aria-hidden="true" style="display: flex; flex-direction: column; width: 52px; height: 38px; border: 2px solid var(--c-ink); border-radius: 4px; overflow: hidden; flex: none">
            <i style="flex: 1; background: {{l.c1}}"></i><i style="flex: 1; background: {{l.c2}}"></i><i style="flex: 1; background: {{l.c3}}"></i>
          </span>
          <span style="flex: 1; min-width: 0">
            <span class="display" style="display: block; font-size: 32px">{{l.native}}</span>
            <span style="display: block; font-size: 15px; font-weight: 600">{{l.name}} · {{l.blurb}}</span>
          </span>
          <sc-if value="{{l.soon}}" hint-placeholder-val="{{ false }}"><span class="sticker p" style="--rot: 8deg; position: absolute; right: 14px; top: -12px">Coming soon</span></sc-if>
          <sc-if value="{{l.on}}" hint-placeholder-val="{{ false }}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 30px; height: 30px; stroke-width: 3"><path d="M4 12.5 9.5 18 20 6"></path></svg></sc-if>
        </button>
      </li>
    </sc-for>
  </ul>

  <div class="foot" style="margin-top: auto">
    <a class="btn block" href="Onboard-2-Why.dc.html">Next</a>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"languages":{"editor":null,"tsType":"{ code: string; name: string; native: string; blurb: string; available: boolean; flag: [string, string, string] }[]"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { picked: 'de' };
  renderVals() {
    const langs = this.props.languages ?? [
      { code: 'de', name: 'German', native: 'Deutsch', blurb: 'Berlin-ready', available: true, flag: ['#0a0a0a', '#dd2b2b', '#ffce00'] },
      { code: 'ru', name: 'Russian', native: 'Русский', blurb: 'next up', available: false, flag: ['#f3efe4', '#2457d6', '#dd2b2b'] },
    ];
    return {
      languages: langs.map((l) => {
        const on = l.available && this.state.picked === l.code;
        return {
          ...l, on, soon: !l.available, disabled: !l.available, pressed: on ? 'true' : 'false',
          c1: l.flag[0], c2: l.flag[1], c3: l.flag[2],
          cls: (on ? 'paper' : 'card') + (l.available ? '' : ' tilt'),
          pick: () => l.available && this.setState({ picked: l.code }),
        };
      }),
    };
  }
}
</script>
</body>
</html>

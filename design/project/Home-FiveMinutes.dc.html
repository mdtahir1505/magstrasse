<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STRASSE — 5-minute mode</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./strasse.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap">
<style>body{margin:0}</style>
</helmet>
<main class="screen" style="width: 390px; height: 844px">
  <div class="pad session-top">
    <a class="icon-btn" href="Main.dc.html" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <span class="eyebrow" style="flex: 1; text-align: center">5-minute mode</span>
    <span style="width: 44px"></span>
  </div>

  <section class="pad" style="margin-top: 30px; position: relative">
    <span class="marker" style="position: absolute; left: 26px; top: -6px; color: var(--c-pink); font-size: 26px; transform: rotate(-8deg)">quick hit</span>
    <h1 class="display" style="font-size: 168px; line-height: .85; margin-top: 26px; color: var(--c-yellow); text-shadow: 6px 6px 0 var(--c-pink)">{{minutes}}:00</h1>
    <p style="margin-top: 16px; font-size: 20px; font-weight: 700; line-height: 1.3">{{dueCount}} words you're about to forget. That's it.</p>
  </section>

  <ul class="pad" style="margin-top: 26px; display: flex; flex-direction: column; gap: 10px">
    <li class="card" style="display: flex; gap: 12px; align-items: center; padding: 12px 14px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--c-yellow)"><path d="M4 12.5 9.5 18 20 6"></path></svg><span>Counts for your streak</span></li>
    <li class="card" style="display: flex; gap: 12px; align-items: center; padding: 12px 14px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--c-yellow)"><path d="M4 12.5 9.5 18 20 6"></path></svg><span>Review only. No new stuff, no speaking</span></li>
    <li class="card" style="display: flex; gap: 12px; align-items: center; padding: 12px 14px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--c-yellow)"><path d="M4 12.5 9.5 18 20 6"></path></svg><span>Stop whenever. Progress saves per card</span></li>
  </ul>

  <div class="foot" style="margin-top: auto; align-items: center; gap: 22px">
    <div class="drip-wrap">
      <a class="btn giant block" href="Ex-ListenPick.dc.html" style="background: var(--c-cyan)">Go</a>
      <svg class="drips" viewBox="0 0 350 30" preserveAspectRatio="none" aria-hidden="true"><path d="M52 0v18a4.5 4.5 0 0 0 9 0V0zM160 0v10a3.5 3.5 0 0 0 7 0V0zM262 0v24a5 5 0 0 0 10 0V0z" style="fill: var(--c-cyan)"></path></svg>
    </div>
    <a class="link" href="Main.dc.html">Actually, I've got time. Full session</a>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"minutes":{"editor":"int","default":5,"min":1,"max":10},"dueCount":{"editor":"int","default":10,"min":1,"max":40},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { minutes: this.props.minutes ?? 5, dueCount: this.props.dueCount ?? 10 };
  }
}
</script>
</body>
</html>

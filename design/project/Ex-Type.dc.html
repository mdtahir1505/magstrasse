<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STRASSE — Type it</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./strasse.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap">
<style>body{margin:0}</style>
</helmet>
<main class="screen" style="width: 390px; height: 844px">
  <div class="pad session-top">
    <a class="icon-btn" href="Main.dc.html" aria-label="End session"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <div class="segbar" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="{{total}}" aria-valuenow="{{pos}}">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="3"><div class="{{s.cls}}" style="--w: {{s.w}}"><i style="width: {{s.pct}}%"></i></div></sc-for>
    </div>
    <span class="count">{{pos}}/{{total}}</span>
  </div>
  <p class="block-label pad" style="margin-top: 4px">{{blockName}}</p>

  <h1 class="instruction pad" style="margin-top: 18px">Type it</h1>
  <div class="pad" style="margin-top: 14px">
    <div class="paper tilt" style="--rot: 1deg; padding: 14px 16px">
      <p class="eyebrow">In {{langName}}, please</p>
      <p class="prompt" style="margin-top: 4px">{{exercise.prompt}}</p>
    </div>
  </div>

  <div class="pad" style="margin-top: 28px; display: flex; flex-direction: column; gap: 12px">
    <label for="answer" class="eyebrow">Your answer</label>
    <input id="answer" class="field" lang="{{lang}}" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Tippen…" value="{{text}}" onChange="{{onText}}">
    <div class="keys" role="group" aria-label="Special characters">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="4">
        <button type="button" class="char-key" onClick="{{k.add}}" aria-label="Insert {{k.char}}">{{k.char}}</button>
      </sc-for>
    </div>
    <p class="small dim">Typos in umlauts? Close enough counts. We'll show you the fix.</p>
  </div>

  <div class="foot" style="margin-top: auto">
    <a class="{{checkCls}}" href="Feedback-Wrong.dc.html">Check</a>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"exercise":{"editor":null,"tsType":"Extract<Exercise, { kind: \"type\" }>"},"session":{"editor":null,"tsType":"Session"},"specialKeys":{"editor":null,"tsType":"string[]"},"lang":{"editor":null,"tsType":"string"},"langName":{"editor":null,"tsType":"string"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { text: 'Ich hatte gern ein Wasser' };
  renderVals() {
    const ex = this.props.exercise ?? { kind: 'type', prompt: "I'd like a water.", answer: 'Ich hätte gern ein Wasser.' };
    const filler = (n) => Array.from({ length: n }, () => ({ kind: 'say', target: '', english: '' }));
    const S = this.props.session ?? { blocks: [{ name: 'review', exercises: filler(8) }, { name: 'new', exercises: filler(10) }, { name: 'speak', exercises: filler(6) }], current: { block: 1, exercise: 6 } };
    const segs = S.blocks.map((b, i) => {
      const n = b.exercises.length;
      const d = i < S.current.block ? n : i === S.current.block ? S.current.exercise : 0;
      return { w: n, pct: Math.round((d / n) * 100), cls: 'bar' + (d === n ? ' done' : '') };
    });
    const total = S.blocks.reduce((a, b) => a + b.exercises.length, 0);
    const pos = S.blocks.slice(0, S.current.block).reduce((a, b) => a + b.exercises.length, 0) + S.current.exercise + 1;
    const blockName = { review: 'Review', new: 'New lesson', speak: 'Listen & speak' }[S.blocks[S.current.block].name];
    const keys = this.props.specialKeys ?? ['ä', 'ö', 'ü', 'ß'];
    return {
      segs, total, pos, blockName, exercise: ex,
      lang: this.props.lang ?? 'de', langName: this.props.langName ?? 'German',
      text: this.state.text,
      onText: (e) => this.setState({ text: e.target.value }),
      keys: keys.map((char) => ({ char, add: () => this.setState({ text: this.state.text + char }) })),
      checkCls: 'btn block' + (this.state.text.trim() ? '' : ' off'),
    };
  }
}
</script>
</body>
</html>

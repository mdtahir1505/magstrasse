<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STRASSE — Shadowing</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./strasse.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap">
<style>body{margin:0}</style>
</helmet>
<main class="screen" style="width: 390px; height: 844px">
  <div class="pad session-top">
    <a class="icon-btn" href="Main.dc.html" aria-label="End session"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <div class="segbar" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="{{total}}" aria-valuenow="{{pos}}">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="3"><div class="{{s.cls}}" style="--w: {{s.w}}"><i style="width: {{s.pct}}%"></i></div></sc-for>
    </div>
    <span class="count">{{pos}}/{{total}}</span>
  </div>
  <p class="block-label pad" style="margin-top: 4px">{{blockName}}</p>

  <h1 class="instruction pad" style="margin-top: 18px">Shadow it</h1>
  <ol class="pad" style="margin-top: 12px; display: flex; gap: 8px" aria-label="Steps">
    <li class="sticker" style="--rot: -2deg">1 · Play</li>
    <li class="sticker" style="--rot: 2deg">2 · Record</li>
    <li class="sticker y" style="--rot: -3deg">3 · Compare</li>
  </ol>

  <section class="pad" style="margin-top: 24px">
    <p lang="{{lang}}" style="font-size: 28px; font-weight: 800; line-height: 1.25">{{exercise.target}}</p>
    <p class="dim" style="margin-top: 4px; font-size: 17px">{{exercise.english}}</p>
  </section>

  <section class="pad" style="margin-top: 24px">
    <div class="paper" style="padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" class="audio" aria-label="Play native speaker"><svg class="ico fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></button>
        <div style="flex: 1">
          <p class="eyebrow">Native</p>
          <div class="wave" role="img" aria-label="Native speaker waveform" style="height: 44px; color: var(--c-ink)">
            <sc-for list="{{native}}" as="b" hint-placeholder-count="32"><i style="height: {{b}}%"></i></sc-for>
          </div>
        </div>
      </div>
      <div class="divider-tape" aria-hidden="true" style="height: 6px"></div>
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" class="audio" aria-label="Play your recording" style="background: var(--c-pink)"><svg class="ico fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></button>
        <div style="flex: 1">
          <p class="eyebrow">You</p>
          <div class="wave" role="img" aria-label="Your recording waveform" style="height: 44px; color: var(--c-pink)">
            <sc-for list="{{mine}}" as="b" hint-placeholder-count="32"><i style="height: {{b}}%; outline: 1px solid var(--c-ink)"></i></sc-for>
          </div>
        </div>
      </div>
    </div>
    <p class="small" style="margin-top: 14px; font-weight: 600">Pretty close. You rushed <b lang="{{lang}}" style="color: var(--c-yellow)">geht's</b>, so let it breathe.</p>
  </section>

  <div class="foot" style="margin-top: auto; flex-direction: row; align-items: center">
    <button type="button" class="mic" aria-label="Record again" style="width: 64px; height: 64px; border-width: 3px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 28px; height: 28px"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
    <a class="btn" href="Session-Complete.dc.html" style="flex: 1">Next</a>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"exercise":{"editor":null,"tsType":"Extract<Exercise, { kind: \"shadow\" }>"},"session":{"editor":null,"tsType":"Session"},"nativeWave":{"editor":null,"tsType":"number[]"},"myWave":{"editor":null,"tsType":"number[]"},"lang":{"editor":null,"tsType":"string"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ex = this.props.exercise ?? { kind: 'shadow', target: "Wie geht's? Mir geht's gut, danke.", english: "How's it going? I'm good, thanks." };
    const filler = (n) => Array.from({ length: n }, () => ({ kind: 'say', target: '', english: '' }));
    const S = this.props.session ?? { blocks: [{ name: 'review', exercises: filler(8) }, { name: 'new', exercises: filler(10) }, { name: 'speak', exercises: filler(6) }], current: { block: 2, exercise: 5 } };
    const segs = S.blocks.map((b, i) => {
      const n = b.exercises.length;
      const d = i < S.current.block ? n : i === S.current.block ? S.current.exercise : 0;
      return { w: n, pct: Math.round((d / n) * 100), cls: 'bar' + (d === n ? ' done' : '') };
    });
    const total = S.blocks.reduce((a, b) => a + b.exercises.length, 0);
    const pos = S.blocks.slice(0, S.current.block).reduce((a, b) => a + b.exercises.length, 0) + S.current.exercise + 1;
    const blockName = { review: 'Review', new: 'New lesson', speak: 'Listen & speak' }[S.blocks[S.current.block].name];
    // waveform amplitudes 0–100; real values come from the audio layer
    const native = this.props.nativeWave ?? [20, 45, 80, 60, 30, 12, 50, 90, 70, 40, 15, 8, 35, 75, 95, 65, 30, 10, 25, 55, 85, 60, 35, 15, 40, 70, 50, 25, 10, 30, 20, 8];
    const mine = this.props.myWave ?? [25, 50, 70, 65, 20, 40, 85, 75, 30, 12, 45, 80, 90, 55, 20, 30, 60, 80, 50, 25, 45, 70, 55, 30, 15, 40, 60, 35, 15, 10, 8, 6];
    return { segs, total, pos, blockName, exercise: ex, lang: this.props.lang ?? 'de', native, mine };
  }
}
</script>
</body>
</html>

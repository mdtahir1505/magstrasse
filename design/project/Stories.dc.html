<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STRASSE — Stories</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./strasse.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap">
<style>body{margin:0} .story{display:block;text-decoration:none;color:var(--c-ink);transition:transform 90ms ease} .story:active{transform:rotate(0) scale(.98)}</style>
</helmet>
<main class="screen" style="width: 390px; height: 844px">
  <header class="pad" style="padding-top: 8px">
    <p class="eyebrow">Read &amp; listen</p>
    <h1 class="display" style="font-size: 48px">Stories</h1>
    <div style="display: flex; gap: 8px; margin-top: 12px" role="group" aria-label="Filter by level">
      <button type="button" class="chip dark sel">All</button>
      <button type="button" class="chip dark">A1</button>
      <button type="button" class="chip dark">A2</button>
      <button type="button" class="chip dark">B1</button>
    </div>
  </header>

  <ul class="grow scroll pad" style="padding-top: 22px; padding-bottom: 24px; display: flex; flex-direction: column; gap: 22px">
    <sc-for list="{{stories}}" as="s" hint-placeholder-count="4">
      <li>
        <a class="story paper tilt" href="Story-Reader.dc.html" style="--rot: {{s.rot}}; padding: 16px 16px 14px; position: relative; background: {{s.bg}}">
          <div style="display: flex; align-items: center; gap: 8px">
            <span class="sticker" style="--rot: -4deg; background: var(--c-ink); color: var(--c-paper)">{{s.level}}</span>
            <span class="small" style="font-weight: 700">{{s.minutes}} min · audio</span>
          </div>
          <h2 lang="{{lang}}" class="display" style="font-size: 34px; margin-top: 10px">{{s.title}}</h2>
          <p lang="{{lang}}" class="small" style="margin-top: 6px; font-weight: 500; color: var(--c-ink-dim)">“{{s.preview}}”</p>
        </a>
      </li>
    </sc-for>
  </ul>

  <nav class="tabbar" aria-label="Main">
    <a class="tab" href="Main.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>Today</a>
    <a class="tab" href="Course-Map.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="5" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M6 7.5V12a3 3 0 0 0 3 3h6a3 3 0 0 1 3 1.5"></path></svg>Course</a>
    <a class="tab on" href="Stories.dc.html" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Stories</a>
    <a class="tab" href="Talk.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Talk</a>
    <a class="tab" href="Stats.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Me</a>
  </nav>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stories":{"editor":null,"tsType":"Story[]"},"lang":{"editor":null,"tsType":"string"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const one = (target, english) => [{ target, english }];
    const stories = this.props.stories ?? [
      { id: 'st1', title: 'Der erste Kaffee', level: 'A1', minutes: 3, lines: one('Lena steht im Café. Sie ist nervös.', 'Lena is standing in the café. She is nervous.') },
      { id: 'st2', title: 'Neu in Berlin', level: 'A1', minutes: 4, lines: one('Ich heiße Sam. Ich komme aus Leeds.', "My name is Sam. I'm from Leeds.") },
      { id: 'st3', title: 'Die WG-Party', level: 'A2', minutes: 6, lines: one('Die Musik ist laut, die Küche ist voll.', 'The music is loud, the kitchen is full.') },
      { id: 'st4', title: 'Späti um Mitternacht', level: 'A2', minutes: 5, lines: one('Hast du noch Club-Mate?', 'Do you still have Club-Mate?') },
      { id: 'st5', title: 'Der letzte Zug', level: 'B1', minutes: 8, lines: one('Die U8 fährt nicht mehr. Was jetzt?', "The U8 isn't running anymore. Now what?") },
    ];
    const BG = ['var(--c-paper)', 'var(--c-yellow)', 'var(--c-paper)', 'var(--c-cyan)', 'var(--c-pink)'];
    const ROT = ['-1.5deg', '1.2deg', '-0.8deg', '1.6deg', '-1.2deg'];
    return {
      lang: this.props.lang ?? 'de',
      stories: stories.map((s, i) => ({ ...s, preview: s.lines[0]?.target ?? '', bg: BG[i % 5], rot: ROT[i % 5] })),
    };
  }
}
</script>
</body>
</html>
